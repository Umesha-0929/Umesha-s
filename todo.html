<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>todo app</title>

<style>
body{
  margin: 20px;
  font-family: 'Roboto';
  background: url(https://img.freepik.com/premium-photo/digital-lecture-online-education-blank-space-paper-graduate-hat-laptop-mobile-phone-website-background-social-distance-concept_35691-25676.jpg?semt=ais_hybrid) no-repeat center/cover;

  display: flex;
  justify-content: flex-start;   
  align-items: center;

  min-height: 100vh;
  padding-left: 200px; 
}

.container{
  width:90%;
  max-width:600px;
  padding:100px;
  border-radius:20px;
  background:lightgray;
}

h2{text-align:center;}

.input-box{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  margin-bottom:30px;
}
              
input{
  flex:1;
  padding:20px;
 border: none;
  border-radius:20px;
  background:#e0e5ec; 
  box-shadow: 5px 5px 10px #a3b1c6,
              -5px -5px 10px #ffffff;
}

button{
  padding:10px;
  border:none;
  border-radius:15px;
  background:#e0e5ec;
  box-shadow: 5px 5px 10px #a3b1c6,
              -5px -5px 10px #ffffff;
}

.filters{
  display:flex;
  justify-content:center;
  gap:30px;
  margin-bottom:20px;
}

.filters button.active{
  background:#6c63ff;
  color:white;
}

li{
  padding:12px;
  margin:20px ;
  border-radius:20px;
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
  background:#e0e5ec;
  box-shadow: 5px 5px 10px #a3b1c6,
              -5px -5px 10px #ffffff;
}

.done{
  text-decoration:line-through;
  opacity:0.6;
}

small{
  display:block;
  font-size:12px;
  opacity:0.7;
}

.progress{
  height:10px;
  margin-top:15px;
  border-radius:10px;
  background:#e0e5ec;
  box-shadow: inset 5px 5px 10px #a3b1c6,
              inset -5px -5px 10px #ffffff;
}

.bar{
  height:100%;
  width:0%;
  border-radius:10px;
  background:#302b91;
}
</style>
</head>

<body>

<div class="container">
<h2>🧠 Study Track...</h2>

<div class="input-box">
<input id="task" placeholder="Add Your Task...">
<input type="date" id="date">
<button onclick="addTask()">➕</button>
</div>

<div class="filters">
<button onclick="setFilter('all')" class="active">All</button>
<button onclick="setFilter('pending')">Pending</button>
<button onclick="setFilter('completed')">Completed</button>
</div>

<ul id="list"></ul>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<p id="status"></p>

</div>

<script>
let tasks = JSON.parse(localStorage.getItem("softTasks")) || [];
let filter = "all";

function save(){
  localStorage.setItem("softTasks", JSON.stringify(tasks));
}

function addTask(){
  let val = document.getElementById("task").value;
  let date = document.getElementById("date").value;

  if(!val.trim()) return;

  tasks.push({
    id:Date.now(),
    text:val,
    done:false,
    date:date
  });

  document.getElementById("task").value="";
  document.getElementById("date").value="";

  save();
  render();
}

function toggleTask(id){
  tasks = tasks.map(t => t.id===id ? {...t, done:!t.done} : t);
  save(); render();
}

function deleteTask(id){
  tasks = tasks.filter(t => t.id!==id);
  save(); render();
}

function setFilter(f){
  filter = f;

  document.querySelectorAll(".filters button")
    .forEach(b => b.classList.remove("active"));

  event.target.classList.add("active");
  render();
}

function getTasks(){
  if(filter==="pending") return tasks.filter(t=>!t.done);
  if(filter==="completed") return tasks.filter(t=>t.done);
  return tasks;
}

function render(){
  let list = document.getElementById("list");
  list.innerHTML="";

  getTasks().forEach(t=>{
    let li = document.createElement("li");

    li.innerHTML=`
      <div>
        <span class="${t.done?'done':''}">${t.text}</span>
        <small>📅 ${t.date || "No date"}</small>
      </div>

      <div>
        <button onclick="toggleTask(${t.id})">✔</button>
        <button onclick="deleteTask(${t.id})">🗑</button>
      </div>
    `;

    list.appendChild(li);
  });

  update();
}

function update(){
  let done = tasks.filter(t=>t.done).length;
  let total = tasks.length;

  document.getElementById("status").innerText =
    `${done} of ${total} completed`;

  let percent = total ? (done/total)*100 : 0;
  document.getElementById("bar").style.width = percent+"%";
}

render();
</script>

</body>
</html>
